<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- ============ PWA 配置 ============ -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="猫咪工作台">
<meta name="application-name" content="猫咪工作台">
<meta name="theme-color" content="#FF9F6B">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">

<!-- 图标 -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">

<!-- 启动画面 (iOS) -->
<link rel="apple-touch-startup-image" href="icon-512.png">

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<script src="config.js"></script>

<title>🐱 猫咪寄养工作台</title>
<style>
  /* ============ 设计变量 ============ */
  :root {
    --bg: #FFF8F0;
    --card-bg: #FFFFFF;
    --primary: #FF9F6B;
    --primary-light: #FFD3B6;
    --mint: #7DD3A8;
    --mint-light: #D4F0E0;
    --blue: #A8D8E8;
    --pink: #FFB6C1;
    --pink-red: #FF6B7A;
    --text: #5D4E3C;
    --text-light: #8B7E6B;
    --gray: #E8E0D5;
    --gray-dark: #C4B8A8;
    --orange-bg: #FFF0E0;
    --mint-bg: #E8F7EE;
    --shadow: 0 2px 12px rgba(93, 78, 60, 0.08);
    --shadow-hover: 0 4px 20px rgba(93, 78, 60, 0.15);
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input, select, textarea { font-family: inherit; font-size: 14px; }

  /* ============ 通用组件 ============ */
  .cat-divider {
    display: flex; align-items: center; gap: 8px;
    margin: 16px 0 10px; padding: 0 16px;
  }
  .cat-divider::after {
    content: ""; flex: 1; height: 2px;
    background: repeating-linear-gradient(90deg, var(--primary-light) 0 8px, transparent 8px 14px);
    border-radius: 2px;
  }
  .cat-divider span {
    font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap;
  }
  .cat-divider .icon { font-size: 16px; }

  /* ============ 顶部Header ============ */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: linear-gradient(135deg, var(--primary) 0%, #FFB088 100%);
    padding: 12px 16px 10px;
    box-shadow: 0 2px 12px rgba(255, 159, 107, 0.3);
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    color: #fff;
  }
  .header-title {
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .header-stats {
    display: flex; gap: 8px; margin-top: 8px;
  }
  .stat-pill {
    flex: 1; background: rgba(255,255,255,0.92);
    border-radius: 20px; padding: 6px 10px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; font-weight: 600; color: var(--text);
  }
  .stat-pill .num { font-size: 15px; }
  .stat-pill { cursor: pointer; transition: transform 0.12s; }
  .stat-pill:active { transform: scale(0.95); }
  .stat-pill.green .num { color: var(--mint); }
  .stat-pill.orange .num { color: var(--primary); }
  .stat-pill.pink .num { color: var(--pink-red); }

  /* ============ 接送时间横幅 ============ */
  .pickup-section {
    padding: 12px 0 6px;
  }
  .pickup-section-title {
    padding: 0 16px 8px;
    font-size: 13px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 4px;
  }
  .pickup-scroll {
    display: flex; gap: 10px;
    overflow-x: auto; padding: 2px 16px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .pickup-scroll::-webkit-scrollbar { display: none; }

  .pickup-card {
    flex-shrink: 0; width: 200px;
    border-radius: var(--radius);
    padding: 12px; position: relative; overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.15s;
  }
  /* 并排模式：卡片宽度自适应，字号缩小 */
  .pickup-card.compact { width: 100%; padding: 10px; }
  .pickup-card.compact .pickup-time { font-size: 22px; }
  .pickup-card.compact .pickup-dir { font-size: 11px; }
  .pickup-card.compact .pickup-cat { font-size: 13px; }
  .pickup-card:active { transform: scale(0.97); }
  .pickup-card.in { background: linear-gradient(135deg, #FFF0E0 0%, #FFE0C8 100%); }
  .pickup-card.out { background: linear-gradient(135deg, #E8F7EE 0%, #D0F0DC 100%); }
  .pickup-card.urgent { background: linear-gradient(135deg, #FFE0E6 0%, #FFC8D4 100%); animation: urgentPulse 1.5s ease-in-out infinite; }
  @keyframes urgentPulse {
    0%,100% { box-shadow: 0 2px 12px rgba(255,107,122,0.2); }
    50% { box-shadow: 0 2px 20px rgba(255,107,122,0.5); }
  }
  .pickup-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    border-radius: 5px 0 0 5px;
  }
  .pickup-card.in::before { background: var(--primary); }
  .pickup-card.out::before { background: var(--mint); }
  .pickup-card.urgent::before { background: var(--pink-red); }

  .pickup-dir {
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 3px;
    margin-bottom: 4px;
  }
  .pickup-dir.in { color: #E08040; }
  .pickup-dir.out { color: #4DA880; }
  .pickup-dir.urgent { color: var(--pink-red); }
  .pickup-time {
    font-size: 30px; font-weight: 800;
    line-height: 1.1; letter-spacing: -1px;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .pickup-card.in .pickup-time { color: #E08040; }
  .pickup-card.out .pickup-time { color: #4DA880; }
  .pickup-card.urgent .pickup-time { color: var(--pink-red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.6; } }
  .pickup-cat {
    font-size: 14px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 4px;
  }
  .pickup-info {
    font-size: 11px; color: var(--text-light);
    margin-top: 3px;
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .pickup-info .tag {
    background: rgba(255,255,255,0.7); padding: 1px 7px;
    border-radius: 8px;
  }
  .pickup-countdown {
    font-size: 11px; font-weight: 700;
    margin-top: 6px; text-align: right;
  }
  .pickup-card.urgent .pickup-countdown { color: var(--pink-red); }

  /* 预定卡片 - 蓝紫色系 */
  .pickup-card.booking-card { background: linear-gradient(135deg, #F0EAFF 0%, #E0D4FF 100%); }
  .pickup-card.booking-card::before { background: #9B7FD4; }
  .pickup-card.booking-card.arrived { background: linear-gradient(135deg, #E8F7EE 0%, #D0F0DC 100%); }
  .pickup-card.booking-card.arrived::before { background: var(--mint); }
  .pickup-dir.booking { color: #7B5FBE; }
  .pickup-card.booking-card .pickup-time { color: #7B5FBE; }
  .pickup-card.booking-card.arrived .pickup-time { color: #4DA880; }
  .pickup-card.booking-card.urgent { background: linear-gradient(135deg, #FFE0E6 0%, #FFC8D4 100%); animation: urgentPulse 1.5s ease-in-out infinite; }
  .pickup-card.booking-card.urgent::before { background: var(--pink-red); }
  .pickup-card.booking-card.urgent .pickup-time { color: var(--pink-red); }
  .pickup-card.booking-card.urgent .pickup-dir { color: var(--pink-red); }

  /* 空状态 */
  .pickup-empty {
    margin: 0 16px; padding: 20px;
    background: var(--card-bg); border-radius: var(--radius);
    text-align: center; color: var(--text-light);
    box-shadow: var(--shadow);
  }
  .pickup-empty .emoji { font-size: 40px; display: block; margin-bottom: 6px; }
  .pickup-empty .text { font-size: 13px; }

  /* ============ 日期条 ============ */
  .date-bar-wrap {
    background: var(--card-bg);
    box-shadow: 0 -8px 16px -8px rgba(0,0,0,0.03);
  }
  .date-scroll {
    display: flex; gap: 6px;
    overflow-x: auto; padding: 10px 16px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .date-scroll::-webkit-scrollbar { display: none; }
  .date-chip {
    flex-shrink: 0; width: 52px;
    border-radius: 14px; padding: 8px 4px;
    text-align: center; background: var(--bg);
    border: 2px solid transparent;
    transition: all 0.15s; position: relative;
  }
  .date-chip .weekday { font-size: 11px; color: var(--text-light); }
  .date-chip .day { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .date-chip .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--primary); margin: 3px auto 0;
    opacity: 0;
  }
  .date-chip.has-booking .dot { opacity: 1; }
  .date-chip.active {
    background: var(--primary); border-color: var(--primary);
  }
  .date-chip.active .weekday, .date-chip.active .day { color: #fff; }
  .date-chip.active .dot { background: #fff; }
  .date-chip.today::before {
    content: "🐾"; position: absolute; top: -4px; right: -4px;
    font-size: 13px;
  }

  /* ============ 日历选择器 ============ */
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 4px;
  }
  .cal-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 4px;
  }
  .cal-nav {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg); font-size: 20px; font-weight: 700;
    color: var(--primary); display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .cal-nav:active { background: var(--primary-light); }
  .cal-grid {
    display: none; padding: 4px 12px 8px;
    grid-template-columns: repeat(7, 1fr); gap: 2px;
  }
  .cal-grid.show { display: grid; }
  .cal-weekday {
    text-align: center; font-size: 11px; color: var(--text-light);
    padding: 4px 0; font-weight: 600;
  }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--text);
    border-radius: 50%; transition: all 0.12s;
    position: relative;
  }
  .cal-day.other-month { color: var(--gray-dark); opacity: 0.5; }
  .cal-day.has-booking::after {
    content: ""; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--primary);
  }
  .cal-day.today { color: var(--primary); font-weight: 800; }
  .cal-day.today::before {
    content: "🐾"; position: absolute; top: -2px; right: -2px; font-size: 10px;
  }
  .cal-day.selected {
    background: var(--primary); color: #fff;
  }
  .cal-day.selected.has-booking::after { background: #fff; }
  .cal-day:active { transform: scale(0.9); }

  /* ============ 空房可视化网格 ============ */
  .avail-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    margin-top: 4px;
  }
  .avail-cell {
    padding: 8px 4px; border-radius: 10px; text-align: center;
    font-size: 12px; font-weight: 700; transition: all 0.12s;
    border: 2px solid transparent; position: relative;
  }
  .avail-cell.free { background: var(--mint-light); color: #4DA880; }
  .avail-cell.booked { background: var(--orange-bg); color: #C07030; opacity: 0.6; }
  .avail-cell.occupied { background: var(--primary-light); color: #A05020; opacity: 0.6; }
  .avail-cell.maintenance { background: var(--gray); color: var(--gray-dark); opacity: 0.5; }
  .avail-cell.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
  .avail-cell:active { transform: scale(0.93); }
  .avail-cell .ac-label { font-size: 11px; }
  .avail-cell .ac-status { font-size: 10px; font-weight: 600; opacity: 0.8; }

  /* ============ 房型看板 ============ */
  .room-section { padding: 4px 0 16px; }
  .room-grid {
    display: grid; gap: 8px; padding: 0 16px;
  }
  .room-grid.large { grid-template-columns: repeat(3, 1fr); }
  .room-grid.small { grid-template-columns: repeat(6, 1fr); }
  .room-grid.vip { grid-template-columns: repeat(2, 1fr); }

  .room-card {
    aspect-ratio: 1;
    border-radius: 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    position: relative; transition: transform 0.12s;
    box-shadow: var(--shadow);
    text-align: center; padding: 4px 2px;
  }
  .room-card:active { transform: scale(0.93); }
  .room-card .room-id { font-size: 10px; opacity: 0.7; }
  .room-card .room-icon { font-size: 18px; line-height: 1; margin-bottom: 2px; }
  .room-card .room-cat { font-size: 10px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .room-card.free { background: var(--mint-light); color: #4DA880; }
  .room-card.booked { background: var(--orange-bg); color: #C07030; }
  .room-card.occupied { background: var(--primary-light); color: #A05020; }
  .room-card.maintenance { background: var(--gray); color: var(--gray-dark); }

  .room-card.vip-card {
    aspect-ratio: 2.2;
    flex-direction: row; gap: 8px; padding: 8px 12px;
    justify-content: flex-start;
  }
  .room-card.vip-card .room-icon { font-size: 24px; margin-bottom: 0; }
  .room-card.vip-card .vip-info { text-align: left; flex: 1; }
  .room-card.vip-card .room-id { font-size: 11px; }
  .room-card.vip-card .room-cat { font-size: 12px; }

  /* 整组包房卡片 */
  .whole-booking-card {
    margin: 0 16px; padding: 16px;
    background: linear-gradient(135deg, #F0EAFF 0%, #E0D4FF 100%);
    border-radius: var(--radius); display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow); cursor: pointer; transition: transform 0.12s;
    border-left: 5px solid #9B7FD4;
  }
  .whole-booking-card:active { transform: scale(0.98); }
  .whole-booking-card .whole-icon { font-size: 32px; }
  .whole-booking-card .whole-info { flex: 1; }
  .whole-booking-card .whole-title { font-size: 15px; font-weight: 700; color: #7B5FBE; }
  .whole-booking-card .whole-detail { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .whole-booking-card .whole-time { font-size: 11px; color: var(--text-light); margin-top: 4px; }

  /* ============ 底部按钮 ============ */
  .fab {
    position: fixed; bottom: 20px; right: 20px; z-index: 90;
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #FFB088);
    box-shadow: 0 4px 16px rgba(255,159,107,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 28px; font-weight: 300;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.9); }

  /* ============ 浮层（详情/表单）============ */
  .overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(93, 78, 60, 0.4);
    display: none; align-items: flex-end; justify-content: center;
    animation: fadeIn 0.2s;
  }
  .overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .sheet {
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    width: 100%; max-height: 92vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease-out;
    padding: 0 0 100px;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle {
    width: 40px; height: 5px; background: var(--gray-dark);
    border-radius: 3px; margin: 10px auto 6px;
  }
  .sheet-title {
    font-size: 17px; font-weight: 700; text-align: center;
    padding: 4px 16px 12px; display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  /* 房间详情 */
  .detail-card {
    margin: 0 16px 12px; background: var(--card-bg);
    border-radius: var(--radius); padding: 14px;
    box-shadow: var(--shadow);
  }
  .detail-row {
    display: flex; justify-content: space-between;
    padding: 7px 0; border-bottom: 1px dashed var(--gray);
    font-size: 13px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .label { color: var(--text-light); }
  .detail-row .val { font-weight: 600; }

  /* ============ 表单 ============ */
  .form-section {
    margin: 0 16px 14px; background: var(--card-bg);
    border-radius: var(--radius); padding: 14px 14px 6px;
    box-shadow: var(--shadow);
  }
  .form-section-title {
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 10px; color: var(--text);
  }
  .field { margin-bottom: 12px; }
  .field-label {
    font-size: 12px; color: var(--text-light);
    margin-bottom: 5px; display: block; font-weight: 600;
  }
  .field-label .req { color: var(--pink-red); }
  .field input, .field select, .field textarea {
    width: 100%; border: 2px solid var(--gray);
    border-radius: var(--radius-sm); padding: 10px 12px;
    background: #fff; color: var(--text);
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--primary);
  }
  .field textarea { resize: none; min-height: 64px; }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }

  .tag-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-btn {
    padding: 7px 14px; border-radius: 20px;
    background: var(--bg); border: 2px solid var(--gray);
    font-size: 12px; font-weight: 600; color: var(--text-light);
    transition: all 0.15s;
  }
  .tag-btn.active {
    background: var(--primary-light); border-color: var(--primary);
    color: #A05020;
  }
  .tag-btn.active.mint {
    background: var(--mint-light); border-color: var(--mint); color: #4DA880;
  }

  .form-actions {
    position: sticky; bottom: 0;
    background: var(--bg); padding: 12px 16px;
    border-top: 1px solid var(--gray);
    display: flex; gap: 8px;
  }
  .btn {
    flex: 1; padding: 13px; border-radius: 24px;
    font-size: 15px; font-weight: 700;
    transition: transform 0.12s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), #FFB088);
    color: #fff;
    box-shadow: 0 3px 12px rgba(255,159,107,0.35);
  }
  .btn-ghost {
    background: var(--bg); color: var(--text-light);
    border: 2px solid var(--gray);
  }
  .btn-danger {
    background: #FFF0F2; color: var(--pink-red);
    border: 2px solid var(--pink-red);
  }

  /* ============ 庆祝动画 ============ */
  .celebrate {
    position: fixed; inset: 0; z-index: 300;
    display: none; align-items: center; justify-content: center;
    background: rgba(255,248,240,0.95);
    flex-direction: column;
  }
  .celebrate.show { display: flex; animation: fadeIn 0.3s; }
  .celebrate .cat { font-size: 64px; animation: bounce 0.6s ease infinite alternate; }
  .celebrate .text { font-size: 18px; font-weight: 700; color: var(--primary); margin-top: 12px; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }

  /* ============ Toast ============ */
  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(93,78,60,0.92); color: #fff;
    padding: 10px 20px; border-radius: 20px;
    font-size: 13px; z-index: 400;
    opacity: 0; transition: opacity 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ============ 自动匹配提示 ============ */
  .match-list {
    display: none; position: absolute; left: 0; right: 0; top: 100%;
    z-index: 50; background: #fff; border-radius: 0 0 12px 12px;
    box-shadow: 0 4px 16px rgba(93,78,60,0.15); overflow: hidden;
    max-height: 240px; overflow-y: auto;
  }
  .match-list.show { display: block; }
  .match-item {
    padding: 10px 12px; border-bottom: 1px solid var(--gray);
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    transition: background 0.12s;
  }

<script>
/* ============ 数据层 ============ */
const STORAGE_KEY = 'cat_hotel_bookings_v4';
let bookings = [];
let selectedDate = new Date();
let formState = {
  ageUnit: '岁',
  vaccine: '', neuter: '', deworm: '', health: [],
  roomType: '', delivery: '', goHome: '', editId: null, presetRoom: null
};

// 房间配置 - 按区域分类，每组独立编号
// 辅助：生成某区域N个柜子
function makeCabins(area, type, count){
  return Array.from({length:count},(_,i)=>({id:area+'-'+type+(i+1), type:type, area:area, label:type+(i+1)}));
}

// 看板分区配置
const BOARD_SECTIONS = [
  { title:'客厅大柜', icon:'🏠', rooms: makeCabins('客厅大柜','大柜',6), gridClass:'large', areaKey:'客厅大柜' },
  { title:'主卧小柜', icon:'🛏️', rooms: makeCabins('主卧小柜','小柜',12), gridClass:'small', areaKey:'主卧小柜', allowWhole:true },
  { title:'客厅小柜', icon:'🛋️', rooms: makeCabins('客厅小柜','小柜',6), gridClass:'small', areaKey:'客厅小柜' },
  { title:'次卧小柜', icon:'🚪', rooms: makeCabins('次卧小柜','小柜',6), gridClass:'small', areaKey:'次卧小柜' },
  { title:'包房区', icon:'👑', rooms: makeCabins('包房','包房',1), gridClass:'vip', areaKey:'包房' }
];

// 扁平化所有房间，用于房态计算和表单分配
const ALL_ROOMS = BOARD_SECTIONS.flatMap(s=>s.rooms);

// 示例数据
function loadSampleData(){
  const today = new Date();
  const fmt = (d)=>d.toISOString().slice(0,16);
  const t = new Date(today);
  t.setHours(10,0,0,0);
  const t2 = new Date(today); t2.setHours(18,0,0,0);
  const t3 = new Date(today); t3.setHours(14,30,0,0);
  const tom = new Date(today); tom.setDate(tom.getDate()+1); tom.setHours(11,0,0,0);
  const out1 = new Date(today); out1.setDate(out1.getDate()+2); out1.setHours(17,0,0,0);
  const in3 = new Date(today); in3.setHours(in3.getHours()+1, in3.getMinutes()+20); // 1小时内紧急
  return [
    {
      id:'b001', ownerName:'张小姐', phone:'13812345678',
      catName:'咪咪', breed:'布偶', age:{value:2,unit:'岁'}, weight:4.5,
      vaccine:'已完整接种', neutered:'已绝育', deworm:'已驱虫', health:['健康'],
      notes:'怕生，不要和其他猫接触',
      roomType:'大柜', roomId:'客厅大柜-大柜1',
      checkIn:fmt(t), checkOut:fmt(out1),
      delivery:'主人送达', goHome:'主人到店接回', address:''
    },
    {
      id:'b002', ownerName:'李先生', phone:'13987654321',
      catName:'橘子', breed:'橘猫', age:{value:5,unit:'岁'}, weight:6.2,
      vaccine:'部分接种', neutered:'未绝育', deworm:'未驱虫', health:['需服药','特殊护理'],
      notes:'每天需服药，有过敏体质',
      roomType:'包房', roomId:'包房-包房1',
      checkIn:fmt(tom), checkOut:'',
      delivery:'上门接猫', goHome:'店铺送猫回家', address:'朝阳区xx路123号'
    },
    {
      id:'b003', ownerName:'王阿姨', phone:'13611112222',
      catName:'团子', breed:'英短', age:{value:1,unit:'岁'}, weight:3.8,
      vaccine:'已完整接种', neutered:'已绝育', deworm:'部分驱虫', health:['健康'],
      notes:'很黏人，喜欢玩毛线球',
      roomType:'小柜', roomId:'主卧小柜-小柜3',
      checkIn:fmt(in3), checkOut:fmt(t2),
      delivery:'顺风车', goHome:'主人到店接回', address:''
    }
  ];
}

/* ============ 云端同步配置（从config.js加载）============ */
const GITHUB_TOKEN = window.CAT_HOTEL_CONFIG ? window.CAT_HOTEL_CONFIG.token : '';
const GITHUB_OWNER = 'rwndvhhv74-cell';
const GITHUB_REPO = 'cat-hotel-pwa';
const GITHUB_DATA_PATH = 'data.json';
const GITHUB_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_DATA_PATH}`;

let cloudSyncing = false; // 是否正在同步中
let cloudSHA = null; // 远程文件的SHA，更新时需要

// 从云端拉取数据
async function cloudLoad(){
  try {
    cloudSyncing = true; updateSyncStatus();
    const resp = await fetch(GITHUB_API, {
      headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github+json' }
    });
    if(resp.status===404){
      // 远程没有data.json，首次使用，上传本地数据
      cloudSyncing = false;
      if(bookings.length>0) cloudSave();
      return null;
    }
    if(!resp.ok) throw new Error('GitHub API: '+resp.status);
    const data = await resp.json();
    cloudSHA = data.sha;
    const content = JSON.parse(atob(data.content.replace(/\n/g,'')));
    return content;
  } catch(e){
    console.log('[云端] 拉取失败:', e.message);
    return null;
  } finally {
    cloudSyncing = false; updateSyncStatus();
  }
}

// 推送数据到云端
async function cloudSave(){
  try {
    cloudSyncing = true; updateSyncStatus();
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(bookings))));
    const body = { message: '📦 同步预定数据 ' + new Date().toLocaleString('zh-CN'), content: content };
    if(cloudSHA) body.sha = cloudSHA;
    const resp = await fetch(GITHUB_API, {
      method: 'PUT',
      headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if(resp.ok){
      const data = await resp.json();
      cloudSHA = data.content.sha;
      console.log('[云端] 同步成功');
      toast('☁️ 已同步到云端');
    } else {
      const err = await resp.json();
      console.log('[云端] 同步失败:', err.message);
      toast('⚠️ 云端同步失败，数据已存本地');
    }
  } catch(e){
    console.log('[云端] 同步异常:', e.message);
  } finally {
    cloudSyncing = false; updateSyncStatus();
  }
}

// 同步状态指示器
function updateSyncStatus(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(cloudSyncing){
    el.textContent = '🔄 同步中…';
    el.style.color = '#FF9F6B';
  } else {
    el.textContent = '☁️ 已同步';
    el.style.color = '#7DD3A8';
  }
}

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try { bookings = JSON.parse(raw); } catch(e){ bookings = loadSampleData(); saveData(); }
  } else {
    bookings = loadSampleData();
    saveData();
  }
  // 异步从云端拉取最新数据
  cloudLoad().then(remote=>{
    if(remote && Array.isArray(remote)){
      bookings = remote;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
      renderAll();
      toast('☁️ 已从云端同步 '+bookings.length+' 条预定');

  });
}
function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(bookings));
  // 防抖：避免频繁保存时多次请求
  clearTimeout(window._saveTimer);
  window._saveTimer = setTimeout(()=> cloudSave(), 800);
}

/* ============ 日期工具 ============ */
const WD = ['日','一','二','三','四','五','六'];
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateTimeLocal(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16); }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function parseDT(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d; }

/* ============ 房态计算 ============ */
/* ============ 整组包房判断 ============ */
// 判断某区域在指定日期是否被整组包房预定
function getWholeBooking(areaKey, date){
  const dayStart = new Date(date); dayStart.setHours(0,0,0,0);
  const dayEnd = new Date(date); dayEnd.setHours(23,59,59,999);
  for(const b of bookings){
    if(b.roomType!=='主卧包房') continue;
    if(b.areaKey!==areaKey && !b.roomId.startsWith(areaKey)) continue;
    const ci = parseDT(b.checkIn);
    const co = b.checkOut?parseDT(b.checkOut):null;
    if(!ci) continue;
    if(ci <= dayEnd && (!co || co >= dayStart)){
      return b;
    }
  }
  return null;
}

function getRoomStatus(roomId, date){
  // 维护中（暂用 localStorage 标记）
  const maints = JSON.parse(localStorage.getItem('cat_hotel_maintenance')||'[]');
  if(maints.includes(roomId)) return {status:'maintenance', booking:null};

  // 检查该房间所属区域是否被整组包房
  const room = ALL_ROOMS.find(r=>r.id===roomId);
  if(room && room.area){
    const whole = getWholeBooking(room.area, date);
    if(whole) return {status:'occupied', booking:whole, wholeBooking:true};
  }

  const dayStart = new Date(date); dayStart.setHours(0,0,0,0);
  const dayEnd = new Date(date); dayEnd.setHours(23,59,59,999);

  const list = bookings.filter(b=>b.roomId===roomId);
  for(const b of list){
    const ci = parseDT(b.checkIn), co = b.checkOut?parseDT(b.checkOut):null;
    if(!ci) continue;
    // 入住当天算 booked（还未到店）或在住
    const isToday = sameDay(ci, date);
    const inRange = ci <= dayEnd && (!co || co >= dayStart);
    if(inRange){
      // 判断是预定还是在住：入住时间已过 = 在住
      const now = new Date();
      const isTodayToday = sameDay(date, now);
      if(isTodayToday && ci <= now){
        // 已经入住，且未退房 = 在住
        if(!co || co > now) return {status:'occupied', booking:b};
      }
      // 否则是预定
      return {status:'booked', booking:b};
    }
  }
  return {status:'free', booking:null};
}

/* ============ 渲染：日历选择器 + 日期条 ============ */
let calVisible = false; // 日历网格是否展开
let calMonth = new Date(); // 当前查看的月份

function calToggleGrid(){
  calVisible = !calVisible;
  renderCalendar();
}
function calShift(delta){
  calMonth.setMonth(calMonth.getMonth()+delta);
  renderCalendar();
}

function renderCalendar(){
  // 标题
  document.getElementById('calTitle').textContent = '📅 '+calMonth.getFullYear()+'年'+(calMonth.getMonth()+1)+'月';
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  grid.classList.toggle('show', calVisible);
  if(!calVisible) return;

  // 星期表头
  const weekdays = ['日','一','二','三','四','五','六'];
  for(const w of weekdays){
    const el = document.createElement('div');
    el.className = 'cal-weekday';
    el.textContent = w;
    grid.appendChild(el);
  }

  // 计算当月第一天是星期几
  const year = calMonth.getFullYear();
  const month = calMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  // 上个月补位
  const prevDays = new Date(year, month, 0).getDate();
  for(let i=startWeekday-1; i>=0; i--){
    const d = new Date(year, month-1, prevDays-i);
    const cell = makeCalCell(d, true, today);
    grid.appendChild(cell);
  }
  // 当月
  for(let i=1; i<=daysInMonth; i++){
    const d = new Date(year, month, i);
    const cell = makeCalCell(d, false, today);
    grid.appendChild(cell);
  }
  // 下个月补位到 42 格
  const filled = startWeekday + daysInMonth;
  const remain = (filled <= 35) ? (35-filled) : (42-filled);
  for(let i=1; i<=remain; i++){
    const d = new Date(year, month+1, i);
    const cell = makeCalCell(d, true, today);
    grid.appendChild(cell);
  }
}

function makeCalCell(d, otherMonth, today){
  const cell = document.createElement('div');
  cell.className = 'cal-day';
  if(otherMonth) cell.classList.add('other-month');
  if(sameDay(d, today)) cell.classList.add('today');
  if(sameDay(d, selectedDate)) cell.classList.add('selected');
  // 是否有预定
  const hasBook = bookings.some(b=>{
    const ci=parseDT(b.checkIn); if(!ci) return false;
    const co=b.checkOut?parseDT(b.checkOut):null;
    return ci <= new Date(d.getTime()+86399999) && (!co || co >= d);
  });
  if(hasBook) cell.classList.add('has-booking');
  cell.textContent = d.getDate();
  cell.onclick = ()=>{ selectedDate = d; calMonth = new Date(d); renderAll(); };
  return cell;
}

/* ============ 渲染：房型看板 ============ */
function renderRoomGrid(gridEl, rooms, isVip){
  gridEl.innerHTML = '';
  for(const r of rooms){
    const s = getRoomStatus(r.id, selectedDate);
    const card = document.createElement('div');
    card.className = 'room-card '+s.status + (isVip?' vip-card':'');
    let icon = '🟢', label = '空闲';
    if(s.status==='booked'){ icon='📕'; label=s.booking.catName; }
    else if(s.status==='occupied'){ icon='🐱'; label=s.booking.catName; }
    else if(s.status==='maintenance'){ icon='🔧'; label='维护'; }

    if(isVip){
      card.innerHTML = `<div class="room-icon">${icon}</div><div class="vip-info"><div class="room-id">${r.label||r.id} · ${r.type}</div><div class="room-cat">${label}</div></div>`;
    } else {
      card.innerHTML = `<div class="room-icon">${icon}</div><div class="room-id">${r.label||r.id}</div><div class="room-cat">${label}</div>`;
    }
    card.onclick = ()=>openRoomDetail(r.id);
    card.oncontextmenu = (e)=>{ e.preventDefault(); toggleMaintenance(r.id); };
    // 长按触发维护
    let pressTimer;
    card.addEventListener('touchstart',()=>{ pressTimer=setTimeout(()=>toggleMaintenance(r.id),600); });
    card.addEventListener('touchend',()=>clearTimeout(pressTimer));
    card.addEventListener('touchmove',()=>clearTimeout(pressTimer));
    gridEl.appendChild(card);
  }
}

function toggleMaintenance(roomId){
  const list = JSON.parse(localStorage.getItem('cat_hotel_maintenance')||'[]');
  const i = list.indexOf(roomId);
  if(i>=0){ list.splice(i,1); toast(roomId+' 已恢复'); }
  else { list.push(roomId); toast(roomId+' 已设为维护中 🔧'); }
  localStorage.setItem('cat_hotel_maintenance', JSON.stringify(list));
  renderAll();
}

/* ============ 渲染：接送时间横幅 ============ */
function renderPickup(){
  const wrap = document.getElementById('pickupWrap');
  const today = new Date();
  const items = [];
  for(const b of bookings){
    const ci = parseDT(b.checkIn);
    const co = b.checkOut?parseDT(b.checkOut):null;
    // 今日待接送：只统计店铺接送的（上门接猫 + 店铺送猫回家）
    if(ci && sameDay(ci, today) && b.delivery==='上门接猫') items.push({type:'in', time:ci, booking:b});
    if(co && sameDay(co, today) && b.goHome==='店铺送猫回家') items.push({type:'out', time:co, booking:b});
  }
  items.sort((a,b)=>a.time-b.time);

  if(items.length===0){
    wrap.innerHTML = '<div class="pickup-empty"><span class="emoji">😴</span><div class="text">今天没有接送安排，休息一下吧~</div></div>';
    return;
  }

  const now = new Date();
  const scroll = document.createElement('div');
  scroll.className = 'pickup-scroll';
  for(const it of items){
    const isUrgent = it.time > now && (it.time - now) < 3600000;
    const card = document.createElement('div');
    card.className = 'pickup-card ' + (isUrgent?'urgent':it.type);
    const hh = String(it.time.getHours()).padStart(2,'0');
    const mm = String(it.time.getMinutes()).padStart(2,'0');
    const dir = it.type==='in' ? '🚗 店铺接猫入店' : '🏠 店铺送猫回家';
    let countdown = '';
    if(it.time > now){
      const diff = it.time - now;
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      countdown = `还有 ${h}时${m}分`;
    } else {
      countdown = '已到时间';
    }
    card.innerHTML = `
      <div class="pickup-dir ${isUrgent?'urgent':it.type}">${dir}${isUrgent?' 🔔':''}</div>
      <div class="pickup-time">${hh}:${mm}</div>
      <div class="pickup-cat">🐱 ${it.booking.catName}</div>
      <div class="pickup-info">
        <span class="tag">${it.booking.roomId}</span>
        <span class="tag">${it.booking.ownerName}</span>
        <span class="tag">${it.booking.phone.slice(-4)}</span>
      </div>
      <div class="pickup-countdown">${countdown}</div>
    `;
    card.onclick = ()=>openRoomDetail(it.booking.roomId, it.booking.id);
    scroll.appendChild(card);
  }
  wrap.innerHTML = '';
  wrap.appendChild(scroll);
}

/* ============ 渲染：预定横幅（家长送猫到店 / 家长接猫回家）============ */
function renderBookingCard(wrapId, items, dirText, dirIcon, emptyEmoji, emptyText){
  const wrap = document.getElementById(wrapId);
  if(items.length===0){
    wrap.innerHTML = `<div class="pickup-empty" style="margin:0;padding:14px"><span class="emoji" style="font-size:28px">${emptyEmoji}</span><div class="text" style="font-size:12px">${emptyText}</div></div>`;
    return;
  }
  const now = new Date();
  // 并排模式：纵向堆叠，不滚动
  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-direction:column;gap:6px';
  for(const b of items){
    const time = parseDT(dirIcon==='in' ? b.checkIn : b.checkOut);
    const isUrgent = time > now && (time - now) < 3600000;
    const isDone = time <= now;
    const card = document.createElement('div');
    card.className = 'pickup-card booking-card compact' + (isUrgent?' urgent':'') + (isDone?' arrived':'');
    const hh = String(time.getHours()).padStart(2,'0');
    const mm = String(time.getMinutes()).padStart(2,'0');
    let countdown = '';
    if(isDone){
      countdown = dirIcon==='in' ? '✅ 已到店' : '✅ 已接走';
    } else if(time > now){
      const diff = time - now;
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      countdown = `还有 ${h}时${m}分`;
    }
    // 获取房间label
    const room = ALL_ROOMS.find(r=>r.id===b.roomId);
    const roomLabel = room ? room.label : b.roomId;
    card.innerHTML = `
      <div class="pickup-dir booking">${dirText}${isUrgent?' 🔔':''}</div>
      <div class="pickup-time">${hh}:${mm}</div>
      <div class="pickup-cat">🐱 ${b.catName}</div>
      <div class="pickup-info">
        <span class="tag">📍${roomLabel}</span>
      </div>
      <div class="pickup-countdown">${countdown}</div>
    `;
    card.onclick = ()=>openRoomDetail(b.roomId, b.id);
    container.appendChild(card);
  }
  wrap.innerHTML = '';
  wrap.appendChild(container);
}

function renderBooking(){
  const today = new Date();
  // 家长送猫到店 = 今天入住且送店方式是主人送达
  const inItems = bookings.filter(b=>{
    const ci = parseDT(b.checkIn);
    return ci && sameDay(ci, today) && b.delivery==='主人送达';
  }).sort((a,b)=>parseDT(a.checkIn)-parseDT(b.checkIn));
  // 家长接猫回家 = 今天退房且回家方式是主人到店接回
  const outItems = bookings.filter(b=>{
    const co = b.checkOut?parseDT(b.checkOut):null;
    return co && sameDay(co, today) && b.goHome==='主人到店接回';
  }).sort((a,b)=>parseDT(a.checkOut)-parseDT(b.checkOut));

  renderBookingCard('bookingInWrap', inItems, '📦 家长送猫到店', 'in', '📦', '今天没有家长送猫到店');
  renderBookingCard('bookingOutWrap', outItems, '🎁 家长接猫回家', 'out', '🎁', '今天没有家长接猫回家');
}

/* ============ 渲染：本周接送 ============ */
function renderWeekList(){
  const body = document.getElementById('weekListBody');
  const today = new Date(); today.setHours(0,0,0,0);
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate()+7);
  const items = [];
  for(const b of bookings){
    const ci = parseDT(b.checkIn);
    const co = b.checkOut?parseDT(b.checkOut):null;
    if(ci && ci>=today && ci<weekEnd) items.push({type:'in', time:ci, booking:b});
    if(co && co>=today && co<weekEnd) items.push({type:'out', time:co, booking:b});
  }
  items.sort((a,b)=>a.time-b.time);
  if(items.length===0){ document.getElementById('weekList').style.display='none'; return; }
  document.getElementById('weekList').style.display='block';
  body.innerHTML = items.map(it=>{
    const icon = it.type==='in'?'⬆️':'⬇️';

    const tm = String(it.time.getHours()).padStart(2,'0')+':'+String(it.time.getMinutes()).padStart(2,'0');
    return `<div class="week-item"><span class="w-date">${dt}</span><span class="w-icon">${icon}</span><span class="w-cat">${it.booking.catName}</span><span class="w-time">${tm}</span></div>`;

/* ============ 客户信息自动匹配 ============ */
function autoMatch(){
  const owner = document.getElementById('f_ownerName').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const cat = document.getElementById('f_catName').value.trim();
  const list = document.getElementById('matchList');

  // 编辑模式不触发匹配
  if(formState.editId){ list.classList.remove('show'); return; }

  // 至少输入2个字符才开始匹配
  if(owner.length<2 && phone.length<3 && cat.length<1){
    list.classList.remove('show'); return;
  }

  // 搜索已有 bookings 去重（按猫名+手机号）
  const seen = new Set();
  const matches = [];
  for(const b of bookings){
    const key = b.catName+'|'+b.phone;
    if(seen.has(key)) continue;
    let score = 0;
    if(owner && b.ownerName.includes(owner)) score++;
    if(phone && b.phone.includes(phone)) score++;
    if(cat && b.catName.includes(cat)) score++;
    if(score>0){
      seen.add(key);
      matches.push({...b, score});
    }
  }
  matches.sort((a,b)=>b.score-a.score);

  if(matches.length===0){ list.classList.remove('show'); return; }

  list.innerHTML = matches.slice(0,5).map(b=>`
    <div class="match-item" onclick="applyMatch('${b.id}')">
      <span style="font-size:18px">🐱</span>
      <div class="mi-info">
        <div class="mi-cat">${b.catName} · ${b.ownerName}</div>
        <div>${b.phone} · ${b.breed} · ${b.vaccine}</div>
      </div>
      <span class="mi-badge">一键填充</span>
    </div>
  `).join('');
  list.classList.add('show');
}

function applyMatch(bookingId){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b) return;
  // 填充字段（不含预定信息，只填猫咪档案）
  document.getElementById('f_ownerName').value = b.ownerName;
  document.getElementById('f_phone').value = b.phone;
  document.getElementById('f_catName').value = b.catName;
  document.getElementById('f_breed').value = b.breed;
  document.getElementById('f_age').value = b.age.value;
  document.getElementById('f_weight').value = b.weight||'';
  document.getElementById('f_notes').value = b.notes||'';
  document.getElementById('f_address').value = b.address||'';
  formState.ageUnit = b.age.unit;
  formState.vaccine = b.vaccine;
  formState.neuter = b.neutered;
  formState.deworm = b.deworm || '';
  formState.health = [...b.health];
  formState.delivery = b.delivery || '';
  syncTagBtns();
  document.getElementById('matchList').classList.remove('show');
  toast('已自动填充 '+b.catName+' 的信息 ✨');
}

function syncTagBtns(){
  // vaccine
  document.querySelectorAll('#vaccineGroup .tag-btn').forEach(el=>{
    el.classList.toggle('active', el.textContent===formState.vaccine);
  });
  // neuter
  document.querySelectorAll('#neuterGroup .tag-btn').forEach(el=>{
    el.classList.toggle('active', el.textContent===formState.neuter);
  });
  // deworm
  document.querySelectorAll('#dewormGroup .tag-btn').forEach(el=>{
    el.classList.toggle('active', el.textContent===formState.deworm);
  });
  // health
  document.querySelectorAll('#healthGroup .tag-btn').forEach(el=>{
    el.classList.toggle('active', formState.health.includes(el.textContent));
  });
  // roomType & delivery - 遍历所有 tag-btn
  document.querySelectorAll('.tag-btn').forEach(el=>{
    const t = el.textContent.replace(/^[^\u4e00-\u9fa5]+/,'').trim();
    if(['大柜','小柜','包房','主卧包房'].includes(t)) el.classList.toggle('active', t===formState.roomType);
    if(['主人送达','上门接猫','顺风车','其他'].includes(t)) el.classList.toggle('active', t===formState.delivery);
    if(['主人到店接回','店铺送猫回家'].includes(t)) el.classList.toggle('active', t===formState.goHome);
  });
  // 地址栏
  document.getElementById('addrField').style.display = (formState.delivery==='上门接猫'||formState.goHome==='店铺送猫回家')?'block':'none';
  // 空房可视化
  renderAvailGrid();
}

function pickTag(key, val, el){
  if(key==='ageUnit'){
    formState.ageUnit = val;
    document.getElementById('ageUnit_岁').classList.toggle('active', val==='岁');
    document.getElementById('ageUnit_月').classList.toggle('active', val==='月');
    return;
  }
  if(key==='vaccine') formState.vaccine = val;
  else if(key==='neuter') formState.neuter = val;
  else if(key==='deworm') formState.deworm = val;
  else if(key==='roomType'){
    formState.roomType = val;
    formState.presetRoom = null; // 切换房型时清除已选房间
    renderAvailGrid();
  }
  else if(key==='delivery'){
    formState.delivery = val;
    // 上门接猫 或 店铺送猫回家 时显示地址
    document.getElementById('addrField').style.display = (val==='上门接猫')?'block':'none';
  }
  else if(key==='goHome'){
    formState.goHome = val;
    if(val==='店铺送猫回家'){
      document.getElementById('addrField').style.display = 'block';
    } else if(formState.delivery!=='上门接猫'){
      document.getElementById('addrField').style.display = 'none';
    }
  }
  // 同组单选
  if(el){
    const parent = el.parentElement;
    parent.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  }
}

function toggleMulti(key, val, el){
  const i = formState.health.indexOf(val);
  if(i>=0){ formState.health.splice(i,1); el.classList.remove('active'); }
  else { formState.health.push(val); el.classList.add('active'); }
}

function saveForm(){
  const ownerName = document.getElementById('f_ownerName').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const catName = document.getElementById('f_catName').value.trim();
  const age = parseInt(document.getElementById('f_age').value);
  const checkIn = document.getElementById('f_checkIn').value;
  const checkOut = document.getElementById('f_checkOut').value;

  if(!ownerName){ toast('请填写主人姓名'); return; }
  if(!catName){ toast('请填写猫咪名字'); return; }
  if(!age || age<0){ toast('请填写年龄'); return; }
  if(!formState.roomType){ toast('请选择房型'); return; }
  if(!checkIn){ toast('请选择入住日期'); return; }
  if(!formState.vaccine){ toast('请选择疫苗情况'); return; }
  if(!formState.neuter){ toast('请选择绝育情况'); return; }
  if(!formState.deworm){ toast('请选择驱虫情况'); return; }

  // 选房
  let roomId = formState.presetRoom;
  let areaKey = '';
  if(formState.roomType==='主卧包房'){
    // 主卧整组包房：检查该时段主卧小柜是否被整组包房
    roomId = '主卧小柜-整组';
    areaKey = '主卧小柜';
    const ciDate0 = parseDT(checkIn);
    const coDate0 = checkOut ? parseDT(checkOut) : null;
    const conflict = getWholeBooking('主卧小柜', ciDate0 || selectedDate);
    if(conflict){
      toast('主卧小柜该时段已被整组包房预定');
      return;
    }
  } else if(!roomId){
    // 自动分配同类型第一个空闲
    const roomsByType = ALL_ROOMS.filter(r=>r.type===formState.roomType);
    const date = parseDT(checkIn) || selectedDate;
    const free = roomsByType.find(r=>getRoomStatus(r.id, date).status==='free');
    if(!free){ toast('该房型已满，请换房型'); return; }
    roomId = free.id;
  }

  // 日期冲突检查：编辑时允许调整，但同一房间不能和其他客户的预定重叠
  const ciDate = parseDT(checkIn);
  const coDate = checkOut ? parseDT(checkOut) : null;
  if(coDate && coDate < ciDate){ toast('退房日期不能早于入住日期'); return; }
  // 检查同房间是否有其他客户的重叠预定
  const conflict = bookings.find(b=>{
    if(b.id===formState.editId) return false; // 排除自己
    if(b.roomId!==roomId) return false;
    const bCi = parseDT(b.checkIn);
    const bCo = b.checkOut ? parseDT(b.checkOut) : null;
    if(!bCi) return false;
    // 日期重叠判断
    const overlap = ciDate < (bCo||new Date(8640000000000000)) && (coDate||new Date(8640000000000000)) > bCi;
    return overlap;
  });
  if(conflict){
    toast('该房间此时段已被 '+conflict.catName+' 预定，无法调整');
    return;
  }

  const data = {
    id: formState.editId || ('b'+Date.now()),
    ownerName, phone, catName,
    breed: document.getElementById('f_breed').value,
    age: { value: age, unit: formState.ageUnit },
    weight: parseFloat(document.getElementById('f_weight').value)||0,
    vaccine: formState.vaccine,
    neutered: formState.neuter,
    deworm: formState.deworm,
    health: formState.health.length?formState.health:['健康'],
    notes: document.getElementById('f_notes').value.trim(),
    roomType: formState.roomType,
    areaKey: areaKey,
    roomId: roomId,
    checkIn: checkIn,
    checkOut: checkOut || '',
    delivery: formState.delivery || '主人送达',
    goHome: formState.goHome || '主人到店接回',
    address: document.getElementById('f_address').value.trim()
  };

  if(formState.editId){
    const i = bookings.findIndex(b=>b.id===formState.editId);
    if(i>=0) bookings[i] = data;
  } else {
    bookings.push(data);
  }
  saveData();
  closeOverlay('formOverlay');
  // 庆祝
  document.getElementById('celebrate').classList.add('show');
  setTimeout(()=>{
    document.getElementById('celebrate').classList.remove('show');
    renderAll();
  }, 1200);
}

/* ============ 工具 ============ */
function closeOverlay(id){ document.getElementById(id).classList.remove('show'); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ============ 倒计时实时刷新 ============ */
setInterval(()=>{ renderPickup(); renderBooking(); }, 30000);

/* ============ 启动 ============ */
loadData();
renderAll();
